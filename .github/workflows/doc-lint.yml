name: Doc lint

# Companion to ci.yml (S18-21, #354): the main workflow path-ignores
# '**.md' and 'docs/**' to keep doc-only pushes cheap, which would let a
# docs-only PR introduce a broken `revolver` invocation without any check.
# This workflow covers exactly that ignored path set and runs ONLY the doc
# checks: the command-lint test plus the freshness-stamp check (S18-23,
# #355). Path filters are workflow-trigger-level in GitHub Actions, so this
# must be a separate workflow rather than a job in ci.yml.

on:
  push:
    branches: [main, develop]
    paths:
      - '**.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
    paths:
      - '**.md'
      - 'docs/**'

# Cancel superseded runs for the same ref (mirrors ci.yml).
concurrency:
  group: doclint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-lint:
    name: Doc command-lint (fenced CLI invocations)
    runs-on: [self-hosted, linux, x64]
    # Run on branch pushes and non-draft PRs (same guard as ci.yml jobs).
    if: >-
      github.event.pull_request.draft == false || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Define ephemeral conda env + isolated global-DB path
        run: |
          echo "CONDA_ENV=${RUNNER_TEMP}/revolver-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-doclint" >> "$GITHUB_ENV"
          # Same isolation as the ci.yml test job: keep parallel self-hosted
          # runners sharing $HOME off each other's ~/.revolver.
          echo "REVOLVER_HOME=${RUNNER_TEMP}/revolver-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-doclint" >> "$GITHUB_ENV"

      - name: Make conda/mamba available
        run: |
          if command -v mamba >/dev/null 2>&1; then
            echo "mamba already on PATH: $(command -v mamba)"
            exit 0
          fi
          for base in "$HOME/miniforge3" "$HOME/mambaforge" "$HOME/miniconda3" "/opt/conda"; do
            if [ -x "$base/condabin/mamba" ]; then
              echo "$base/condabin" >> "$GITHUB_PATH"
              echo "Added $base/condabin to PATH"
              exit 0
            fi
          done
          echo "::error::Could not find mamba/miniforge on the runner" >&2
          exit 1

      - name: Create ephemeral conda env (Python 3.12)
        run: mamba create -y -p "$CONDA_ENV" -c conda-forge python=3.12

      - name: Install package (dev)
        run: mamba run -p "$CONDA_ENV" python -m pip install -e ".[dev]"

      - name: Run doc command-lint + freshness check
        run: >-
          mamba run -p "$CONDA_ENV" python -m pytest
          tests/unit/test_doc_command_lint.py tests/unit/test_doc_freshness.py -q

      - name: Remove ephemeral conda env
        if: always()
        run: mamba env remove -y -p "$CONDA_ENV" || rm -rf "$CONDA_ENV"
