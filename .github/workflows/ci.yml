name: CI

on:
  push:
    branches: [main, develop]
    # Run the version-check job on release tags. The lint/test jobs are
    # scoped away from tag pushes via per-job `if:` guards below.
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

# No path filters on purpose: every job below is a required status check under
# the branch rulesets, and a required check that never runs leaves the pull
# request stuck on "Expected". Hosted runners make the full pipeline cheap
# (about two minutes), so docs-only and code-only changes run the same jobs.
# The doc-lint job (formerly a separate doc-lint.yml with the inverse path
# filter) lives here for the same reason.

# Least-privilege token: nothing in this workflow writes to the repository.
# Required once the repository is public (fork PRs run with a read-only token
# anyway; this makes same-repo runs match).
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners (ubuntu-latest) replace the self-hosted conda runners:
# a public repository must not expose a self-hosted runner to fork PRs, and
# actions/setup-python provides every interpreter in the matrix directly.
jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    # Skip on tag pushes (handled by version-check); run on PRs (non-draft) and branch pushes.
    if: >-
      !startsWith(github.ref, 'refs/tags/')
      && (github.event.pull_request.draft == false || github.event_name == 'push')
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev)
        run: python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy
        run: mypy

  version-check:
    name: Version/tag consistency (release tags)
    runs-on: ubuntu-latest
    # Run ONLY on pushed v* tags. Never blocks normal branch pushes or PRs.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check tag matches declared version
        run: |
          set -euo pipefail

          # Tag name from refs/tags/vX.Y.Z, stripping the leading 'v'.
          tag="${GITHUB_REF#refs/tags/v}"

          # version = "X.Y.Z" from pyproject.toml [project] table.
          # Accept single- or double-quoted values; '|| true' keeps the empty
          # guard below reachable when grep finds no match under pipefail.
          pyproject_version="$(grep -E '^version[[:space:]]*=' pyproject.toml \
            | head -n1 \
            | sed -E "s/^version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/" || true)"

          # __version__ = "X.Y.Z" from the package __init__.
          init_version="$(grep -E '^__version__[[:space:]]*=' src/revolver/__init__.py \
            | head -n1 \
            | sed -E "s/^__version__[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/" || true)"

          echo "tag (from GITHUB_REF):          $tag"
          echo "pyproject.toml version:         $pyproject_version"
          echo "src/revolver/__init__.py:       $init_version"

          if [ -z "$pyproject_version" ]; then
            echo "::error::Could not extract 'version' from pyproject.toml" >&2
            exit 1
          fi
          if [ -z "$init_version" ]; then
            echo "::error::Could not extract '__version__' from src/revolver/__init__.py" >&2
            exit 1
          fi

          if [ "$tag" != "$pyproject_version" ] || [ "$tag" != "$init_version" ]; then
            echo "::error::Version mismatch on release tag: tag=v${tag}, pyproject.toml=${pyproject_version}, __init__.py=${init_version}. All three must match before tagging a release." >&2
            exit 1
          fi

          echo "Version consistency OK: tag v${tag} matches pyproject.toml and __version__."

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    # Skip on tag pushes (handled by version-check); run on PRs (non-draft) and branch pushes.
    if: >-
      !startsWith(github.ref, 'refs/tags/')
      && (github.event.pull_request.draft == false || github.event_name == 'push')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Define isolated global-DB path
        # Isolate the global DB (~/.revolver) from anything else on the runner;
        # get_global_db() honours $REVOLVER_HOME. (The `runner` context is not
        # available in job-level `env`, hence the $GITHUB_ENV step.)
        run: echo "REVOLVER_HOME=${RUNNER_TEMP}/revolver-home-${{ matrix.python-version }}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev)
        run: python -m pip install -e ".[dev]"

      - name: Clean stale global DB
        run: rm -rf "${REVOLVER_HOME}/.revolver"

      - name: Run tests with coverage
        run: pytest --cov=revolver --cov-report=term-missing --cov-fail-under=80 -m "unit or integration"

      - name: Run L2-OE tests (OpenEvolve contract)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: |
          python -m pip install "openevolve>=0.2.26"
          pytest tests/integration/test_run_oe.py -v --no-header

  doc-lint:
    name: Doc command-lint (fenced CLI invocations)
    runs-on: ubuntu-latest
    # Skip on tag pushes; run on PRs (non-draft) and branch pushes (same guard as lint/test).
    if: >-
      !startsWith(github.ref, 'refs/tags/')
      && (github.event.pull_request.draft == false || github.event_name == 'push')
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Define isolated global-DB path
        run: echo "REVOLVER_HOME=${RUNNER_TEMP}/revolver-home-doclint" >> "$GITHUB_ENV"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev)
        run: python -m pip install -e ".[dev]"

      - name: Run doc command-lint + freshness check
        # S18-21 (#354) command-lint of fenced `revolver` invocations across
        # README.md + docs/**, and S18-23 (#355) `verified-against` stamps.
        run: >-
          python -m pytest
          tests/unit/test_doc_command_lint.py tests/unit/test_doc_freshness.py -q
