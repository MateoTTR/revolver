name: CI

on:
  push:
    branches: [main, develop]
    # Run the version-check job on release tags. The lint/test jobs are
    # scoped away from tag pushes via per-job `if:` guards below so they do
    # not spin up conda envs for a tag-only event.
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Cancel superseded runs for the same ref (e.g. new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: [self-hosted, linux, x64]
    # Skip on tag pushes (handled by version-check); run on PRs (non-draft) and branch pushes.
    if: >-
      !startsWith(github.ref, 'refs/tags/')
      && (github.event.pull_request.draft == false || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v5

      - name: Define ephemeral conda env path
        # Unique per run so parallel jobs on the same runner don't clash.
        run: echo "CONDA_ENV=${RUNNER_TEMP}/revolver-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-lint" >> "$GITHUB_ENV"

      - name: Make conda/mamba available
        run: |
          if command -v mamba >/dev/null 2>&1; then
            echo "mamba already on PATH: $(command -v mamba)"
            exit 0
          fi
          for base in "$HOME/miniforge3" "$HOME/mambaforge" "$HOME/miniconda3" "/opt/conda"; do
            if [ -x "$base/condabin/mamba" ]; then
              echo "$base/condabin" >> "$GITHUB_PATH"
              echo "Added $base/condabin to PATH"
              exit 0
            fi
          done
          echo "::error::Could not find mamba/miniforge on the runner" >&2
          exit 1

      - name: Create ephemeral conda env (Python 3.12)
        run: mamba create -y -p "$CONDA_ENV" -c conda-forge python=3.12

      - name: Install package (dev)
        run: mamba run -p "$CONDA_ENV" python -m pip install -e ".[dev]"

      - name: Ruff check
        run: mamba run -p "$CONDA_ENV" ruff check src/ tests/

      - name: Ruff format check
        run: mamba run -p "$CONDA_ENV" ruff format --check src/ tests/

      - name: Mypy
        run: mamba run -p "$CONDA_ENV" mypy

      - name: Remove ephemeral conda env
        if: always()
        run: mamba env remove -y -p "$CONDA_ENV" || rm -rf "$CONDA_ENV"

  version-check:
    name: Version/tag consistency (release tags)
    runs-on: [self-hosted, linux, x64]
    # Run ONLY on pushed v* tags. Never blocks normal branch pushes or PRs.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches declared version
        run: |
          set -euo pipefail

          # Tag name from refs/tags/vX.Y.Z, stripping the leading 'v'.
          tag="${GITHUB_REF#refs/tags/v}"

          # version = "X.Y.Z" from pyproject.toml [project] table.
          # Accept single- or double-quoted values; '|| true' keeps the empty
          # guard below reachable when grep finds no match under pipefail.
          pyproject_version="$(grep -E '^version[[:space:]]*=' pyproject.toml \
            | head -n1 \
            | sed -E "s/^version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/" || true)"

          # __version__ = "X.Y.Z" from the package __init__.
          init_version="$(grep -E '^__version__[[:space:]]*=' src/revolver/__init__.py \
            | head -n1 \
            | sed -E "s/^__version__[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/" || true)"

          echo "tag (from GITHUB_REF):          $tag"
          echo "pyproject.toml version:         $pyproject_version"
          echo "src/revolver/__init__.py:       $init_version"

          if [ -z "$pyproject_version" ]; then
            echo "::error::Could not extract 'version' from pyproject.toml" >&2
            exit 1
          fi
          if [ -z "$init_version" ]; then
            echo "::error::Could not extract '__version__' from src/revolver/__init__.py" >&2
            exit 1
          fi

          if [ "$tag" != "$pyproject_version" ] || [ "$tag" != "$init_version" ]; then
            echo "::error::Version mismatch on release tag: tag=v${tag}, pyproject.toml=${pyproject_version}, __init__.py=${init_version}. All three must match before tagging a release." >&2
            exit 1
          fi

          echo "Version consistency OK: tag v${tag} matches pyproject.toml and __version__."

  test:
    name: Test (pytest + coverage)
    runs-on: [self-hosted, linux, x64]
    # Skip on tag pushes (handled by version-check); run on PRs (non-draft) and branch pushes.
    if: >-
      !startsWith(github.ref, 'refs/tags/')
      && (github.event.pull_request.draft == false || github.event_name == 'push')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Define ephemeral conda env path
        run: echo "CONDA_ENV=${RUNNER_TEMP}/revolver-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-test-${{ matrix.python-version }}" >> "$GITHUB_ENV"

      - name: Make conda/mamba available
        run: |
          if command -v mamba >/dev/null 2>&1; then
            echo "mamba already on PATH: $(command -v mamba)"
            exit 0
          fi
          for base in "$HOME/miniforge3" "$HOME/mambaforge" "$HOME/miniconda3" "/opt/conda"; do
            if [ -x "$base/condabin/mamba" ]; then
              echo "$base/condabin" >> "$GITHUB_PATH"
              echo "Added $base/condabin to PATH"
              exit 0
            fi
          done
          echo "::error::Could not find mamba/miniforge on the runner" >&2
          exit 1

      - name: Create ephemeral conda env (Python ${{ matrix.python-version }})
        run: mamba create -y -p "$CONDA_ENV" -c conda-forge python=${{ matrix.python-version }}

      - name: Install package (dev)
        run: mamba run -p "$CONDA_ENV" python -m pip install -e ".[dev]"

      - name: Clean stale global DB
        run: rm -rf ~/.revolver

      - name: Run tests with coverage
        run: mamba run -p "$CONDA_ENV" pytest --cov=revolver --cov-report=term-missing --cov-fail-under=80 -m "unit or integration"

      - name: Run L2-OE tests (OpenEvolve contract)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: |
          mamba run -p "$CONDA_ENV" python -m pip install "openevolve>=0.2.26"
          mamba run -p "$CONDA_ENV" pytest tests/integration/test_run_oe.py -v --no-header

      - name: Remove ephemeral conda env
        if: always()
        run: mamba env remove -y -p "$CONDA_ENV" || rm -rf "$CONDA_ENV"
