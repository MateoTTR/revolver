name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: self-hosted
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup venv
        run: |
          python3.12 -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"

      - name: Ruff check
        run: . .venv/bin/activate && ruff check src/ tests/

      - name: Ruff format check
        run: . .venv/bin/activate && ruff format --check src/ tests/

      - name: Mypy
        run: . .venv/bin/activate && mypy src/revolver/

  test:
    name: Test (pytest + coverage)
    runs-on: self-hosted
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup venv
        run: |
          python${{ matrix.python-version }} -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"

      - name: Clean stale global DB
        run: rm -rf ~/.revolver

      - name: Run tests with coverage
        run: |
          . .venv/bin/activate
          pytest --cov=revolver --cov-report=term-missing --cov-fail-under=80 -m "unit or integration"

      - name: Run L2-OE tests (OpenEvolve contract)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: |
          . .venv/bin/activate
          pip install "openevolve>=0.2.26"
          pytest tests/integration/test_run_oe.py -v --no-header
