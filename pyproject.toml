[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revolver"
version = "0.14.0"
description = "MLOps CLI platform for LLM-guided evolutionary optimization via OpenEvolve"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Revolver Contributors" }]

dependencies = [
    "typer>=0.21",
    "click>=8",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
openevolve = ["openevolve"]
# ShinkaEvolve backend — opt-in (ADR-007 D6). Never pulled by dev/test extras.
shinka = ["shinka-evolve>=0.0.7,<0.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML",
]

[project.scripts]
revolver = "revolver.cli:app"

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
force-single-line = false
combine-as-imports = true

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["revolver"]
mypy_path = "src"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# L3 E2E tests are nightly/manual-only (val-e2e-tests.md): deselected by
# default so a plain `pytest tests/` never runs them, even in an env with
# the engine extras installed. Run them explicitly with `-m e2e`.
addopts = "-m 'not e2e'"
markers = [
    "unit: L1 unit tests",
    "integration: L2 integration tests",
    "openevolve: L2-OE tests requiring the openevolve package (no LLM needed)",
    "shinkaevolve: L2-Shinka tests requiring the shinka-evolve package (no LLM needed)",
    "e2e: L3 end-to-end tests",
    "slow: long-running tests (always applied to E2E tests)",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["revolver"]
omit = ["src/revolver/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
